<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Page Layout</title>
    <style>
        /* Base reset for consistent spacing */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Simulates the outer blue screen/background */
        body {
            background-color: #4da6ff; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* The main white container holding all boxes */
        .container {
            background-color: white;
            padding: 10px;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 10px; /* Creates the white gaps between rows */
            border-radius: 8px; 
        }

        /* Top Green Header */
        .header-box {
            background-color: #a2d149;
            height: 150px;
            width: 100%;
        }

        /* Middle Teal Section - Desktop Layout (Side-by-side) */
        .middle-section {
            display: flex;
            flex-direction: row;
            gap: 10px;
        }

        .teal-box {
            background-color: #00c3c9;
            height: 180px;
            flex: 1; /* Ensures all three boxes share equal width */
        }

        /* Bottom Gray Section - Desktop Layout (4 columns) */
        .bottom-section {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px;
        }

        .gray-box {
            background-color: #e6ebec;
            height: 80px;
        }

        /* Responsive Design - Mobile Layout (Viewport < 480px) */
        @media (max-width: 480px) {
            .middle-section {
                flex-direction: column; /* Stack the teal boxes vertically */
            }

            .bottom-section {
                grid-template-columns: repeat(2, 1fr); /* Change gray boxes to a 2x2 grid */
            }
            
            /* Adjust heights slightly for better mobile appearance if desired */
            .teal-box {
                height: 120px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box"></div>

        <div class="middle-section">
            <div class="teal-box"></div>
            <div class="teal-box"></div>
            <div class="teal-box"></div>
        </div>

        <div class="bottom-section">
            <div class="gray-box"></div>
            <div class="gray-box"></div>
            <div class="gray-box"></div>
            <div class="gray-box"></div>
        </div>
    </div>

</body>
</html>
