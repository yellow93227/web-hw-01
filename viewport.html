<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Layout</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #4ea1d3;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* 外框 */
.container {
    background: #eee;
    padding: 20px;
    border-radius: 15px;
    width: 90%;
    max-width: 800px;
}

/* Grid 基本 */
.grid {
    display: grid;
    gap: 10px;
}

/* 區塊樣式 */
.header {
    background: #a8cf45;
    height: 80px;
}

.box {
    background: #1fb5c1;
    height: 80px;
}

.footer {
    background: #ccc;
    height: 60px;
}

/* ===== 桌機版 (>=480px) ===== */
@media (min-width: 480px) {
    .grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .header {
        grid-column: span 3;
    }

    .footer {
        grid-column: span 1;
    }
}

/* ===== 手機版 (<480px) ===== */
@media (max-width: 479px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .header {
        grid-column: span 1;
    }
}
</style>

</head>

<body>

<div class="container">
    <div class="grid">
        <div class="header"></div>

        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>

        <div class="footer"></div>
        <div class="footer"></div>
        <div class="footer"></div>
        <div class="footer"></div>
    </div>
</div>

</body>
</html>
