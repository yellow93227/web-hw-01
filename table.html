<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0">
    <title>Student Info table</title>
    <style>{
      border-collapse: collapse;
    }
    
    table, th, td{
      border: 1px solid black;
    }
    th, td{
      padding: 5px;
      text-align: left;
    }
      </style>
  </head>
  <body>
    <table>
      <tr>
        <th>Name</th>
        <th>Student ID</th>
      </tr>
      <tr>
        <td>Yeh, Jou-Chen</td>
        <td>111401536</td>
      </tr>
    </table>
  </body>
</html>
