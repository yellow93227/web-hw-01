<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Headings Formatting</title>
<style>
  body {
    font-family: "Times New Roman", Times, serif; /* 圖片中使用標準襯線字體 */
    padding: 20px;
  }

  /* Heading 1: 頂部橫線、粉紅色文字陰影 */
  h1 {
    text-decoration: overline; /* 產生文字正上方的橫線 */
    text-shadow: 2px 2px 0px pink; /* 往右下角偏移的粉紅色陰影 */
  }

  /* Heading 2: 斜體、黃色外圍線 (Outline) */
  h2 {
    font-style: italic; /* 將字體設定為斜體 */
    outline: 2px solid #d4d400; /* 題目特別強調 outline，這裡設定為黃色外圍線 */
    padding: 5px; /* 增加一點內距，讓文字不會緊貼著線條 */
  }

  /* Heading 3: 靠右對齊、底線 */
  h3 {
    text-align: right; /* 將區塊內的文字靠右對齊 */
    text-decoration: underline; /* 產生文字底線 */
  }
</style>
</head>
<body>

  <h1>This is heading 1</h1>
  <h2>This is heading 2</h2>
  <h3>This is heading 3</h3>

</body>
</html>
