<!DOCTYPE html>
<html lang="en">
<head>

    <title>Bootstrap Practice</title>
    
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    
    <style>
        /* 稍微增加一點頂部間距，讓畫面不要太貼齊瀏覽器邊緣，看起來會更像圖片的截圖 */
        body {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">

        </div>

            <span class="badge">badge</span>
