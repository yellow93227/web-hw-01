<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlapping Shapes</title>
    <style>
        /* Container to hold the shapes and manage their positioning */
        .shape-container {
            position: relative;
            width: 300px;
            height: 200px;
            margin: 20px;
        }

        /* Styles for the blue rectangle */
        .rectangle {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 160px;
            height: 120px;
            background-color: blue;
            border: 4px solid black;
        }

        /* Styles for the yellow circle */
        .circle {
            position: absolute;
            top: 30px; /* Adjusts vertical position to center it against the rectangle */
            left: 120px; /* Pushes it right to create the overlap */
            width: 100px;
            height: 100px;
            background-color: yellow;
            border: 4px solid red;
            border-radius: 50%; /* This CSS property turns a square into a circle */
        }
    </style>
</head>
<body>

    <div class="shape-container">
        <div class="rectangle"></div>
        <div class="circle"></div>
    </div>

</body>
</html>
