<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Example Assignment</title>
    <style>
        .container {
            border: 2px solid black;
            padding: 20px;
            width: fit-content;
            box-shadow: 5px 5px 8px rgba(0, 0, 0, 0.5); /* Creates the shadow effect */
            background-color: white;
            margin: 20px;
        }

        .normal-text {
            font-family: serif; 
            font-size: 18px;
            margin-bottom: 25px;
        }

        .computer-code {
            font-family: monospace; /* Monospace font for code */
            margin: 0;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="normal-text">Code example:</div>
        <pre class="computer-code">var person = {
    firstName:"Jou-Chen",
    lastName :"Yeh",
    studentId:"111401536"
}</pre>
    </div>

</body>
</html>
