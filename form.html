<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Assignment</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif; 
            margin: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-size: 18px;
        }

        input[type="text"] {
            display: block; /* Puts the input on a new line below the label */
            margin-top: 2px;
            width: 250px;
            font-size: 16px;
            padding: 3px;
        }

        input[type="submit"], input[type="reset"] {
            margin-top: 10px;
            margin-right: 5px;
            font-size: 16px;
            padding: 2px 10px;
        }
    </style>
</head>
<body>

    <form>
        <div class="form-group">
            <label for="firstName">First name:</label>
            <input type="text" id="firstName" name="firstName" value="Jou-Chen">
        </div>

        <div class="form-group">
            <label for="lastName">Last name:</label>
            <input type="text" id="lastName" name="lastName" value="Yeh">
        </div>

        <div class="form-group">
            <label for="studentId">Student ID:</label>
            <input type="text" id="studentId" name="studentId" value="111401536">
        </div>

        <input type="submit" value="Submit">
        <input type="reset" value="重設">
    </form>

</body>
</html>
