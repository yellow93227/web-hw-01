<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Image Styling Practice</title>
    <style>
        /* 整體排版設定，讓圖片橫向排列並置中 */
        .image-gallery {
            display: flex;
            justify-content: space-between; 
            align-items: center; 
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* 左邊圖片：寬度33%、高度300px、圓角18px、不變形 */
        .img-left {
            width: 33%;
            height: 300px; 
            border-radius: 18px;
            object-fit: cover; /* 不變形 (no distortion) */
        }

        /* 中間圖片：寬高150px、正圓形、不變形 */
        .img-middle {
            width: 150px;
            height: 150px;
            border-radius: 50%; /* 變成正圓形 */
            object-fit: cover; /* 不變形 (no distortion) */
        }

        /* 右邊圖片：寬度33%、高度300px、強制拉伸變形 */
        .img-right {
            width: 33%;
            height: 300px;
            object-fit: fill; /* 強制拉伸變形 (distortion) */
        }
    </style>
</head>
<body>

    <div class="image-gallery">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a8/Tour_Eiffel_Wikimedia_Commons.jpg" alt="Eiffel Tower Left" class="img-left">
        
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/46/Trolltunga_2.jpg" alt="Cliff View" class="img-middle">
        
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a8/Tour_Eiffel_Wikimedia_Commons.jpg" alt="Eiffel Tower Right" class="img-right">
    </div>

</body>
</html>
